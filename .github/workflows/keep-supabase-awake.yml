# Supabase pauses a free project after 7 days without activity, and then
# logins, classes and progress stop working until someone restores it in the
# dashboard. This asks the database a small question every other day so that
# doesn't happen. A failed run (GitHub emails you) usually means the project
# is already paused.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       the EXPO_PUBLIC_SUPABASE_URL value from .env
#   SUPABASE_ANON_KEY  the EXPO_PUBLIC_SUPABASE_ANON_KEY value from .env
# GitHub runs scheduled workflows only from the default branch (main), and
# turns them off after 60 days without a commit (it emails a warning first).
name: Keep Supabase awake

on:
  schedule:
    - cron: "23 1 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the database a question
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # Without a login the database refuses to show any rows (HTTP 401,
          # "permission denied"), but it still runs the query - that's the
          # activity Supabase looks for.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered HTTP $status"
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "::error::Supabase didn't answer. The project may be paused: restore it in the dashboard."
            exit 1
          fi
